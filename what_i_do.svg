    <linearGradient id="g1" x2="1" y2="1"><stop stop-color="#27daa2" stop-opacity=".18"/><stop offset="1" stop-color="#27daa2" stop-opacity="0"/></linearGradient>
    <linearGradient id="g2" x2="1" y2="1"><stop stop-color="#5bb8eb" stop-opacity=".18"/><stop offset="1" stop-color="#5bb8eb" stop-opacity="0"/></linearGradient>
    <linearGradient id="g3" x2="1" y2="1"><stop stop-color="#f6b83e" stop-opacity=".18"/><stop offset="1" stop-color="#f6b83e" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1000" height="245" rx="14" fill="#071018"/>
  <rect x="16" y="15" width="312" height="214" rx="14" fill="url(#bg)" stroke="#245142"/>
  <rect x="344" y="15" width="312" height="214" rx="14" fill="url(#bg)" stroke="#284a63"/>
  <rect x="672" y="15" width="312" height="214" rx="14" fill="url(#bg)" stroke="#69502a"/>
  <path d="M17 185h310v43H17z" fill="url(#g1)"/><path d="M345 185h310v43H345z" fill="url(#g2)"/><path d="M673 185h310v43H673z" fill="url(#g3)"/>

